stages:
  - deploy

pages:
  stage: deploy
  script:
    # 1. Create a public folder if it doesn't exist
    # 2. Copy the index.html file into it
    - if (!(Test-Path public)) { New-Item -Path public -ItemType Directory }
    - - Copy-Item index1.html public/index.html
  artifacts:
    paths:
      - public
  only:
    - main
