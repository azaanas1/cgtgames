stages:
  - deploy

pages:
  stage: deploy
  script:
    # Create public folder
    - if (!(Test-Path public)) { New-Item -Path public -ItemType Directory }

    # Copy the homepage
    - Copy-Item index1.html public/index.html

    # Copy CSS and JavaScript
    - Copy-Item style.css public/style.css
    - Copy-Item script.js public/script.js
    - Copy-Item main.js public/main.js
    - Copy-Item analytics.js public/analytics.js
    - Copy-Item analytics.html public/analytics.html
    - Copy-Item settings.html public/settings.html

  artifacts:
    paths:
      - public

  only:
    - main